spring:
  application:
    name: shiftsync-api
  config:
    import: optional:file:.env[.properties]   # loads a local, git-ignored .env if present
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

shiftsync:
  jwt:
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:45}

springdoc:
  swagger-ui:
    path: /docs

---
# ---------- DEV (local) ----------
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/syncshift}
    username: ${DB_USER:syncshiftuser}
    password: ${DB_PASSWORD}          # put it in a local .env file, never in this file
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

shiftsync:
  jwt:
    secret: ${JWT_SECRET:this-is-a-development-only-secret-key-change-me-before-any-real-deployment-32bytes}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  seed:
    enabled: ${SEED_ENABLED:true}

---
# ---------- PROD (Render + Neon) ----------
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 30000
      max-lifetime: 300000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

shiftsync:
  jwt:
    secret: ${JWT_SECRET}             # no default: the app refuses to start without it
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  seed:
    enabled: ${SEED_ENABLED:false}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false